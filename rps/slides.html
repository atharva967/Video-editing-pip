<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buildify RPS carousel</title>
<!-- 1080x1350 Instagram carousel, felt + cut-out hands. Render one slide with ?s=1..5 (rps/build.sh). -->
<style>
@font-face { font-family: "Geist"; src: url(fonts/Geist.woff2) format("woff2"); font-weight: 400 900; }
@font-face { font-family: "Geist Mono"; src: url(fonts/GeistMono.woff2) format("woff2"); font-weight: 400 700; }
:root { --blue: #3B7EFF; --ink: #fff; --hand-y: 660px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: #2F6BEB; }
body { font-family: "Geist", sans-serif; color: var(--ink); }
.slide { position: absolute; inset: 0; display: none; overflow: hidden; background: url(felt.png) center / cover; }
.slide.on { display: block; }
.slide::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(8,20,60,.28)); }

.hand { position: absolute; top: var(--hand-y); transform: translateY(-50%); filter: drop-shadow(0 16px 18px rgba(5,15,50,.32)); z-index: 2; }
.hand.l { left: 0; }
.hand.r { right: 0; transform: translateY(-50%) scaleX(-1); }

.claim { position: absolute; width: 480px; text-align: center; font-weight: 800; font-size: 46px; line-height: 1.08; letter-spacing: -.02em; text-transform: uppercase; text-shadow: 0 2px 10px rgba(5,15,50,.25); z-index: 3; }
.claim.l { left: 40px; bottom: calc(1350px - var(--hand-y) + 210px); }
.claim.r { right: 40px; top: calc(var(--hand-y) + 210px); }

.credit { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font-family: "Geist Mono"; font-size: 13px; color: rgba(255,255,255,.45); z-index: 3; }
.handle { position: absolute; bottom: 52px; right: 60px; font-family: "Geist Mono"; font-weight: 500; font-size: 26px; color: rgba(255,255,255,.9); z-index: 3; }

/* cover */
.cover-title { position: absolute; top: 150px; left: 0; right: 0; text-align: center; font-weight: 900; font-size: 104px; line-height: .95; letter-spacing: -.04em; text-transform: uppercase; text-shadow: 0 4px 18px rgba(5,15,50,.3); z-index: 3; }
.play { position: absolute; top: 960px; left: 50%; transform: translateX(-50%); background: #fff; color: #1A4FD0; font-weight: 800; font-size: 46px; padding: 22px 46px; border-radius: 60px; box-shadow: 0 18px 40px rgba(5,15,50,.3); z-index: 3; white-space: nowrap; }

/* pop-up window */
.win-dialog { position: absolute; left: 90px; right: 90px; top: 290px; height: 760px; background: #F4F5F8; border-radius: 22px; box-shadow: 0 50px 110px rgba(5,15,50,.45); overflow: hidden; color: #121318; z-index: 2; }
.titlebar { height: 64px; background: #E3E6EC; display: flex; align-items: center; padding: 0 24px; gap: 12px; border-bottom: 1px solid #D3D7DF; }
.titlebar i { width: 18px; height: 18px; border-radius: 50%; display: block; }
.titlebar b { margin: 0 auto; transform: translateX(-30px); font-family: "Geist Mono"; font-weight: 500; font-size: 22px; color: #5B6170; }
.dlg-body { padding: 76px 60px 0; text-align: center; }
.dlg-body h2 { font-weight: 900; font-size: 76px; line-height: 1; letter-spacing: -.03em; text-transform: uppercase; }
.dlg-body h2 em { font-style: normal; color: var(--blue); }
.folder { margin: 70px auto 0; width: 240px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.folder svg { width: 220px; height: 176px; filter: drop-shadow(0 16px 30px rgba(59,126,255,.35)); }
.folder span { font-family: "Geist Mono"; font-size: 30px; font-weight: 600; background: rgba(59,126,255,.14); color: #1D4FCC; padding: 6px 20px; border-radius: 10px; }
.cursor { position: absolute; left: 618px; top: 930px; width: 56px; z-index: 5; filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
</style>
</head>
<body>

<!-- 1 cover: rock vs scissors -->
<section class="slide" data-l="rock" data-r="scissors" style="--hand-y: 700px">
  <div class="cover-title">Think you<br>know<br>prototyping?</div>
  <div class="play">Let’s play →</div>
</section>

<!-- 2..4 rounds: left claim (loses) above left hand, right claim (wins) below right hand -->
<section class="slide" data-l="rock" data-r="paper" data-cl="A prototype takes 3 months of dev" data-cr="A prototype takes one afternoon"></section>
<section class="slide" data-l="paper" data-r="scissors" data-cl="Build first, validate later" data-cr="Validate before you spend lakhs"></section>
<section class="slide" data-l="scissors" data-r="rock" data-cl="We just need a better pitch deck" data-cr="Investors want to see it working"></section>

<!-- 5 pop-up -->
<section class="slide">
  <div class="win-dialog">
    <div class="titlebar"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i><b>buildify</b></div>
    <div class="dlg-body">
      <h2>Good ideas need <em>building.</em><br>Not just pitching!</h2>
      <div class="folder">
        <svg viewBox="0 0 200 160"><path d="M10 30 Q10 16 24 16 H78 L96 34 H176 Q190 34 190 48 V140 Q190 150 180 150 H20 Q10 150 10 140 Z" fill="#5B9AFF"/><path d="M10 56 Q10 46 22 46 H178 Q190 46 190 58 V140 Q190 150 180 150 H20 Q10 150 10 140 Z" fill="#3B7EFF"/><g transform="translate(70 70) scale(3)" opacity=".95"><rect x="0.75" y="8.75" width="10.5" height="8.5" rx="2" fill="none" stroke="#fff" stroke-width="1.2"/><rect x="4.75" y="5.75" width="10.5" height="8.5" rx="2" fill="none" stroke="#fff" stroke-width="1.2" opacity=".8"/><rect x="8.75" y="2.75" width="10.5" height="8.5" rx="2" fill="none" stroke="#fff" stroke-width="1.2" opacity=".6"/></g></svg>
        <span>buildify</span>
      </div>
    </div>
  </div>
  <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2 L20 13 L12.5 14.2 L16.5 22 L13.4 23.4 L9.5 15.6 L4 20 Z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <div class="handle">@buildify</div>
</section>

<script>
  const s = +(new URLSearchParams(location.search).get("s") || 1);
  document.querySelectorAll(".slide").forEach((el, i) => {
    const d = el.dataset;
    if (d.l) {
      el.insertAdjacentHTML("beforeend",
        `<img class="hand l" src="hands/h-${d.l}.png" alt="${d.l}"><img class="hand r" src="hands/h-${d.r}.png" alt="${d.r}">` +
        `<div class="credit">Hand photos: Fluff / Sertion, CC BY-SA 3.0, Wikimedia Commons</div>`);
    }
    if (d.cl) el.insertAdjacentHTML("beforeend", `<div class="claim l">${d.cl}</div><div class="claim r">${d.cr}</div>`);
    if (i === s - 1) el.classList.add("on");
  });
</script>
</body>
</html>
